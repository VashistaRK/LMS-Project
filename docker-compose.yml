services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - OIDC_CLIENT_ID=857081833212-ug3q9qmc5kjg5et9u9lfmoe6rlb2167f.apps.googleusercontent.com
      - OIDC_CLIENT_SECRET=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
      - OIDC_ISSUER=https://accounts.google.com
      - OIDC_REDIRECT_URI=https://fresherready.com/auth/callback
      - APP_JWT_SECRET=sjdhf9834hr2y48hr92384hr28fhr9283hf9283hf92hf
      - APP_JWT_ISS=https://fresherready.com
      - APP_JWT_AUD=my-backend-api
      - PORT=3000
      - WEB_ORIGIN=https://fresherready.com
      # - MONGO_URI=mongodb+srv://shoterking1357:MainKey123@cluster0.3kun17m.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
