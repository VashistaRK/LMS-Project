      - backend
    environment:
      - VITE_API_URL=https://fresherready.com/api
      - VITE_API_URL_CMR=https://fresherready.com/api_cmr # or your own URL
      - VITE_SOCKET_URL=https://fresherready.com

  english-tutor:
    build:
